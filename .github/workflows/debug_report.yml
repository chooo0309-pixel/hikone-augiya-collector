name: Debug Report Page (オーギヤ彦根)

on:
  workflow_dispatch: {}

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
     
      - name: List files (確認用)
        run: |
          pwd
          ls -la
          ls -la collector
          
      - name: Python import test (確認用)
        run: |
          python3 -c "import os; print([repr(x) for x in os.listdir('collector')])"

      - name: Run debug script
        run: python -m collector.debug_report
