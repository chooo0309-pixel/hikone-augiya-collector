name: Backfill Collect (オーギヤ彦根)

on:
  workflow_dispatch:
    inputs:
      start:
        description: "開始日 (YYYY-MM-DD)"
        required: true
      end:
        description: "終了日 (YYYY-MM-DD)"
        required: true
      start_url:
        description: "開始URL(省略時は最新レポートから遡る)"
        required: false
      force:
        description: "trueにすると収集済みの日付も上書きし直す"
        required: false
        default: "false"

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Run backfill collector
        run: |
          ARGS="backfill --start ${{ inputs.start }} --end ${{ inputs.end }}"
          if [ -n "${{ inputs.start_url }}" ]; then
            ARGS="$ARGS --start-url ${{ inputs.start_url }}"
          fi
          if [ "${{ inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          python -m collector.main $ARGS
